<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track Pants & Joggers | BACKBENCHERZ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- WhatsApp number (CHANGE ONLY THIS IF NEEDED) -->
  <script>
    const WHATSAPP_NUMBER = "918179456654"; // include country code, no +
  </script>

  <!-- WhatsApp order function -->
  <script>
    function orderOnWhatsApp(category) {
      const message =
        "Hi BACKBENCHERZ,%0A%0A" +
        "Category: " + category + "%0A%0A" +
        "Size:%0A" +
        "Color:%0A" +
        "Delivery Address:%0A" +
        "Mobile Number:%0A%0A" +
        "App Code: BBZ%0A%0A" +
        "Note:%0A" +
        "• Delivery charges apply%0A" +
        "• No returns, exchange only";

      const url =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        message;

      window.open(url, "_blank");
    }
  </script>
</head>

<body>

  <!-- Header -->
  <header class="site-header">
    <h1 class="brand">Track Pants & Joggers</h1>
    <p class="tagline">Comfort · Everyday Wear</p>
  </header>

  <!-- Product section -->
  <main class="categories">

    <div class="product-card">
      <h3>Track Pants & Joggers</h3>

      <p class="price">Price: ₹ ___</p>

      <p class="sizes">
        Available Sizes: Customer to mention on WhatsApp
      </p>

      <div class="order-section">
        <button
          class="whatsapp-btn"
          onclick="orderOnWhatsApp('Track Pants')">
          Order via <span class="wa-icon"></span> WhatsApp
        </button>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>UPI Payment • Hyderabad Local Delivery</p>
    <p class="small">Visit store for fit & exclusive app benefit</p>
  </footer>

</body>
</html>
